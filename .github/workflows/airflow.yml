name: Airflow — Test, Build, Deploy

on:
  push:
    branches: [main]
    paths:
      - 'airflow/**'
  pull_request:
    branches: [main]
    paths:
      - 'airflow/**'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ secrets.AIRFLOW_ECR_REPOSITORY }}

jobs:
  test:
    name: Run DAG Integrity Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r airflow/requirements.txt apache-airflow==2.11.2 pytest

      - name: Vendor src/ modules
        # Copies files from outside airflow/ (the Docker build context), so it
        # must run before both this test step and the image build below.
        run: python airflow/scripts/vendor_src.py

      - name: Run pytest
        working-directory: airflow
        env:
          PYTHONPATH: dags:plugins:include/vendored_src
        run: pytest tests/ -v

  deploy:
    name: Build, Push, Deploy
    needs: test
    # Only deploy on pushes to main — not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Required for GitHub OIDC to request a token
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Vendor src/ modules
        run: python airflow/scripts/vendor_src.py

      - name: Build and push Docker image
        id: build
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f airflow/Dockerfile -t $ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REPOSITORY:latest airflow/
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REPOSITORY:latest
          echo "image=$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to ECS (recreate — SQLite can't tolerate two writers)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Register a new task definition revision with the updated image tag
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition lineuplines-airflow \
            --query 'taskDefinition' \
            --output json)

          NEW_TASK_DEF=$(echo $TASK_DEF | python3 -c "
          import json, sys
          td = json.load(sys.stdin)
          td['containerDefinitions'][0]['image'] = '$ECR_REPOSITORY:$IMAGE_TAG'
          # Remove fields that can't be passed to register-task-definition
          for field in ['taskDefinitionArn', 'revision', 'status', 'requiresAttributes',
                        'compatibilities', 'registeredAt', 'registeredBy']:
              td.pop(field, None)
          print(json.dumps(td))
          ")

          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.AIRFLOW_ECS_SERVICE }} \
            --task-definition $NEW_TASK_ARN

      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.AIRFLOW_ECS_SERVICE }}
          echo "✅ Deployment complete"
